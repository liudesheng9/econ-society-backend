[package]
name = "econ-society-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
rocket_cors = "0.6.0"
diesel = { version = "2.2.9", features = [
    "postgres",
    "r2d2",
    "chrono",
    "serde_json",
] }
diesel_migrations = "2.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
bincode = "1.3.3"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.18.0"
either = "1.9.0"
reqwest = { version = "0.11", features = ["json"] }
lettre = { version = "0.10", features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-native-tls",
] }
uuid = { version = "1.3", features = ["v4", "serde"] }
lazy_static = "1.4.0"
base64 = "0.21.7"
redis = { version = "0.24.0", features = ["aio", "tokio-comp"] }
rand = "0.8.5"
sha2 = "0.10.2"
