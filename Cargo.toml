[package]
name = "community_web"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
rocket_cors = "0.6.0"
diesel = { version = "2.2.9", features = [
    "postgres",
    "r2d2",
    "chrono",
    "serde_json",
] }
diesel_migrations = "2.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
bincode = "1.3.3"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.18.0"
either = "1.9.0"
reqwest = { version = "0.11", features = ["json"] }
